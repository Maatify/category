name: Category Package CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "codex/phase-1-category-draft"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: category-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CATEGORY_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=category_ci;charset=utf8mb4
  CATEGORY_TEST_DB_USER: category_test
  CATEGORY_TEST_DB_PASSWORD: category_test

jobs:
  category-latest:
    name: Category latest dependencies (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]

    services:
      mysql:
        image: mysql:8.0.16
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: category_ci
          MYSQL_USER: category_test
          MYSQL_PASSWORD: category_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
          --log-bin-trust-function-creators=1

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql
          tools: composer
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: PHP syntax
        run: find src tests -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Resolve latest compatible dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable

      - name: Validate optimized PSR-4 autoload
        run: composer dump-autoload --optimize --strict-psr

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Composer audit
        run: composer audit --no-interaction --abandoned=fail

      - name: PHPStan level max
        run: composer analyse

      - name: Unit tests
        run: composer test:unit

      - name: MySQL Integration tests
        run: composer test:integration

      - name: Full Category suite
        run: composer test

  category-lowest:
    name: Category lowest dependencies (PHP 8.2)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0.16
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: category_ci
          MYSQL_USER: category_test
          MYSQL_PASSWORD: category_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
          --log-bin-trust-function-creators=1

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: "8.2"
          extensions: mbstring, pdo, pdo_mysql
          tools: composer
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: PHP syntax
        run: find src tests -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Resolve lowest supported dependencies
        run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist --no-progress

      - name: Validate optimized PSR-4 autoload
        run: composer dump-autoload --optimize --strict-psr

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Composer audit
        run: composer audit --no-interaction --abandoned=fail

      - name: PHPStan level max
        run: composer analyse

      - name: Unit tests
        run: composer test:unit

      - name: MySQL Integration tests
        run: composer test:integration

      - name: Full Category suite
        run: composer test

  workflow-lint:
    name: Workflow syntax lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate GitHub Actions workflows
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint:1.7.7

  category-quality-gate:
    name: Category Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [category-latest, category-lowest, workflow-lint]
    if: always()

    steps:
      - name: Check Category required jobs
        run: |
          set -euo pipefail
          if [ "${{ needs.category-latest.result }}" != "success" ]; then
            echo "category-latest: ${{ needs.category-latest.result }}"
            exit 1
          fi
          if [ "${{ needs.category-lowest.result }}" != "success" ]; then
            echo "category-lowest: ${{ needs.category-lowest.result }}"
            exit 1
          fi
          if [ "${{ needs.workflow-lint.result }}" != "success" ]; then
            echo "workflow-lint: ${{ needs.workflow-lint.result }}"
            exit 1
          fi
          echo "All Category CI jobs passed."
